<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>PartnerCheckin</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <div id="mainContainer">
        <div id="header">
            <div id="settingsIcon">
                <a href="settings.html" id="settingsLink">⚙️</a>
            </div>
        </div>

        <div id="messagingPanel">
            <div id="partnerSection">
                <div id="avatarAnimation">
                    <img id="partnerAvatar" src="images/PartnerA.jpeg" width="200" height="200" />
                </div>
                <div id="messageReceived"></div>
            </div>

            <div id="mySection">
                <input type="text" id="messageInput"/>
                <button id="sendButton">Send</button>
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PartnerCheckin</title>
    <script>
        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
    </script>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <div id="mainContainer">
        <div id="header">
            <div id="settingsIcon">
                <a href="settings.html" id="settingsLink">⚙️</a>
            </div>
        </div>

        <div id="messagingPanel">
            <div id="partnerSection">
                <div id="avatarAnimation">
                    <img id="partnerAvatar" src="images/NonBinary1.png" width="200" height="200" />
                </div>
                <div id="envelope">
                    <div id="chatLogWrapper">
                        <div id="chatLog"></div>
                    </div>
                    <div id="envelopeFront" aria-hidden="true">
                        <span id="envelopeSeal">♥</span>
                    </div>
                </div>
            </div>

            <div id="emojiBar">
                <button type="button" class="emojiButton" data-emoji="😂" aria-label="Laughing">😂</button>
                <button type="button" class="emojiButton" data-emoji="😊" aria-label="Shy smile">😊</button>
                <button type="button" class="emojiButton" data-emoji="🥺" aria-label="Sad watery eyes">🥺</button>
                <button type="button" class="emojiButton" data-emoji="❤️" aria-label="Love heart">❤️</button>
                <button type="button" class="emojiButton" data-emoji="😈" aria-label="Purple devil">😈</button>
                <button type="button" class="emojiButton" data-emoji="😒" aria-label="Side eye">😒</button>
                <button type="button" class="emojiButton" data-emoji="🙄" aria-label="Eye roll">🙄</button>
            </div>

            <div id="mySection">
                <div id="messageInputWrapper">
                    <textarea id="messageInput" rows="1"></textarea>
                </div>
                <button id="sendButton" class="button-82-pushable" role="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">Send</span>
                </button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

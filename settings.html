<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    
    <title>Settings</title>
    <!-- Apply the saved or system-preferred theme before the page styles are drawn. -->
    <script>
        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
    </script>
    <link rel="stylesheet" type="text/css" href="settings.css" />
</head>
<body>
    <!-- Settings content is grouped in a panel that fills the phone viewport. -->
    <div id="mainContainer">
        <!-- The stylesheet displays the logo matching the active theme. -->
        <div id="logo">
            <img class="logo logo-light" src="images/KwikiLight.png" alt="Kwiki" />
            <img class="logo logo-dark" src="images/KwikiDark.png" alt="Kwiki" />
        </div>

        <!-- Names shown on messages in the conversation. -->
        <div id="myName" class="name-section">
            <div id="myNameLabel">My Name</div>
            <input type="text" id="myNameInput" placeholder="Enter your name..." />
        </div>

        <div id="partnerName" class="name-section">
            <div id="partnerNameLabel">Partner Name</div>
            <input type="text" id="partnerNameInput" placeholder="Enter partner name..." />
        </div>

        <!-- Select which partner image appears in the main conversation view. -->
        <div id="chooseAvatarSection">
            <div id="chooseAvatarLabel">Choose your partner's photo</div>
            <label class="avatarChoice">
                <input type="radio" name="avatar" value="images/NonBinary1.png" checked />
                <img src="images/NonBinary1.png"
                     data-light="images/NonBinary1.png"
                     data-dark="images/DarkModeNonBinary1.png"
                     width="100" height="100" />
            </label>
            <label class="avatarChoice">
                <input type="radio" name="avatar" value="images/NonBinary2.png" />
                <img src="images/NonBinary2.png"
                     data-light="images/NonBinary2.png"
                     data-dark="images/DarkModeNonBinary2.png"
                     width="100" height="100" />
            </label>
        </div>

        <!-- Switches the app theme and saves all settings to local storage. -->
        <button id="themeToggle" type="button">🌙 Dark mode</button>

        <!-- Saves the settings and returns to the conversation. -->
        <div id="saveButtonContainer">
            <button id="saveButton" type="button" class="button-82-pushable" role="button">
                <span class="button-82-shadow"></span>
                <span class="button-82-edge"></span>
                <span class="button-82-front text">Save</span>
            </button>
        </div>

    </div>
    <!-- Page behavior: populate settings, handle avatar/theme changes, and save. -->
    <script src="settings.js"></script>
</body>
</html>
